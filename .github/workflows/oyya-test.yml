name: OYYA Tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, fileinfo, openssl
      - name: PHP syntax
        run: |
          find public -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Core smoke test
        run: php tests/smoke.php
